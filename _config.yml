locale: "pt-BR"
title: "Diego Rodrigues"
title_separator: "–"
name: "Diego Rodrigues"
description: "Diretor de Data Strategy & Analytics. Construtor de agentes de IA. Professor de Oratória e Storytelling com Dados. Registro público dos 14 dias de preparação para a formação em Forward Deployed Engineering / A.I. Deployment."
url: "https://diegoalves-data.github.io"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "dark"

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate

paginate: 10
paginate_path: /blog/page:num/

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

repository: "DiegoAlves-data/DiegoAlves-data.github.io"

words_per_minute: 200

author:
  name: "Diego Rodrigues"
  bio: "Diretor de Data Strategy & Analytics. Construtor de agentes de IA. Professor de Oratória e Storytelling com Dados."
  location: "Campinas, SP — Brasil"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/diegoaorodrigues/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/DiegoAlves-data"
    - label: "E-mail"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:diegoalvesteo@gmail.com"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/diegoaorodrigues/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/DiegoAlves-data"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

include:
  - _pages
