<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="570" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">Um trace, sete spans</text>
<text x="30" y="58" font-size="14" fill="#475569">Trace é a execução inteira. Span é cada passo dentro dela. O que não foi gravado aqui não existe na investigação de amanhã.</text>

<text x="40" y="112" font-size="13" font-weight="700" fill="#0f172a">TRACE · conciliar 1 lançamento</text>
<rect x="310" y="92" width="650" height="30" rx="5" fill="#0f172a"/>
<text x="326" y="112" font-size="12" font-weight="700" fill="#ffffff">2.100 ms · R$ 0,31 · desfecho: proposta criada · prompt v7 · modelo v2026-10</text>

<text x="40" y="162" font-size="12" fill="#475569">1 · validar entrada · código · 8 ms</text>
<rect x="310" y="145" width="5" height="24" rx="2" fill="#94a3b8"/>

<text x="40" y="198" font-size="12" fill="#475569">2 · chamada ao modelo · 620 ms</text>
<rect x="312" y="181" width="192" height="24" rx="2" fill="#5eead4"/>
<text x="322" y="198" font-size="11" fill="#0f766e">1.200 tokens in · 90 out</text>

<text x="40" y="234" font-size="12" fill="#475569">3 · tool banco.buscar · 180 ms</text>
<rect x="504" y="217" width="56" height="24" rx="2" fill="#cbd5e1"/>

<text x="40" y="270" font-size="12" fill="#475569">4 · tool erp.cobrancas · 240 ms</text>
<rect x="560" y="253" width="74" height="24" rx="2" fill="#cbd5e1"/>

<text x="40" y="306" font-size="12" fill="#475569">5 · chamada ao modelo · 740 ms</text>
<rect x="634" y="289" width="229" height="24" rx="2" fill="#5eead4"/>
<text x="644" y="306" font-size="11" fill="#0f766e">escolhe a candidata e justifica</text>

<text x="40" y="342" font-size="12" fill="#475569">6 · validar saída · código · 12 ms</text>
<rect x="863" y="325" width="5" height="24" rx="2" fill="#94a3b8"/>

<text x="40" y="378" font-size="12" fill="#475569">7 · tool conciliacao.propor · 300 ms</text>
<rect x="867" y="361" width="93" height="24" rx="2" fill="#fdba74"/>

<path d="M 310 398 L 960 398" stroke="#cbd5e1" stroke-width="1"/>
<text x="310" y="414" font-size="11" fill="#94a3b8">0 ms</text>
<text x="620" y="414" font-size="11" fill="#94a3b8">1.000 ms</text>
<text x="920" y="414" font-size="11" fill="#94a3b8">2.100 ms</text>

<rect x="30" y="432" width="930" height="92" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="48" y="456" font-size="13" font-weight="700" fill="#0f172a">Logue sempre, em cada execução</text>
<text x="48" y="479" font-size="11" fill="#475569">· entrada e saída, com dado sensível mascarado</text>
<text x="48" y="496" font-size="11" fill="#475569">· cada tool: nome, parâmetros e resultado</text>
<text x="48" y="513" font-size="11" fill="#475569">· as decisões: qual caminho do graph, por que escalou</text>
<text x="370" y="479" font-size="11" fill="#475569">· tokens de entrada e de saída</text>
<text x="370" y="496" font-size="11" fill="#475569">· custo por tarefa</text>
<text x="370" y="513" font-size="11" fill="#475569">· latência, por span e total</text>
<text x="650" y="479" font-size="11" font-weight="700" fill="#9a3412">· versão do prompt</text>
<text x="650" y="496" font-size="11" font-weight="700" fill="#9a3412">· versão do modelo</text>
<text x="650" y="513" font-size="11" fill="#475569">· desfecho: propôs, escalou, DLQ</text>

<text x="30" y="550" font-size="12" fill="#9a3412">O trace guarda o contexto inteiro. Então o trace é dado sensível: mascare na escrita do log, não na tela de quem consulta.</text>
</svg>
