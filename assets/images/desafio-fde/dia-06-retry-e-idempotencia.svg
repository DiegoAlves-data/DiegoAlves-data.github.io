<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">A mesma falha de rede, com e sem chave de idempotência</text>
  <text x="30" y="58" font-size="14" fill="#475569">A resposta se perdeu no caminho. O ERP gravou, mas o agente não ficou sabendo, e tenta de novo.</text>

  <text x="30" y="98" font-size="14" font-weight="700" fill="#0f172a">Sem chave</text>
  <g font-size="12">
    <rect x="30" y="110" width="170" height="70" rx="8" fill="#0f172a"/><text x="44" y="136" fill="#ffffff" font-weight="700">1 · agente chama</text><text x="44" y="156" fill="#cbd5e1">conciliacao_propor</text>
    <rect x="222" y="110" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="236" y="136" fill="#0f172a" font-weight="700">2 · ERP grava</text><text x="236" y="156" fill="#475569">proposta P-101</text>
    <rect x="414" y="110" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="428" y="136" fill="#0f172a" font-weight="700">3 · timeout</text><text x="428" y="156" fill="#475569">a resposta não volta</text>
    <rect x="606" y="110" width="170" height="70" rx="8" fill="#0f172a"/><text x="620" y="136" fill="#ffffff" font-weight="700">4 · retry</text><text x="620" y="156" fill="#cbd5e1">mesma chamada</text>
    <rect x="798" y="110" width="170" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="812" y="136" fill="#c2410c" font-weight="700">5 · ERP grava P-102</text><text x="812" y="156" fill="#9a3412">dois registros para</text><text x="812" y="171" fill="#9a3412">o mesmo recebimento</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="200" y1="145" x2="220" y2="145" marker-end="url(#a)"/>
    <line x1="392" y1="145" x2="412" y2="145" marker-end="url(#a)"/>
    <line x1="584" y1="145" x2="604" y2="145" marker-end="url(#a)"/>
    <line x1="776" y1="145" x2="796" y2="145" marker-end="url(#a)"/>
  </g>

  <text x="30" y="238" font-size="14" font-weight="700" fill="#0f172a">Com chave</text><text x="118" y="238" font-size="13" fill="#475569">lanc_8812 + cob_0457 (vem do negócio, não é sorteada)</text>
  <g font-size="12">
    <rect x="30" y="250" width="170" height="70" rx="8" fill="#0f172a"/><text x="44" y="276" fill="#ffffff" font-weight="700">1 · agente chama</text><text x="44" y="296" fill="#cbd5e1">conciliacao_propor</text>
    <rect x="222" y="250" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="236" y="276" fill="#0f172a" font-weight="700">2 · ERP grava</text><text x="236" y="296" fill="#475569">P-101 sob a chave</text>
    <rect x="414" y="250" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="428" y="276" fill="#0f172a" font-weight="700">3 · timeout</text><text x="428" y="296" fill="#475569">a resposta não volta</text>
    <rect x="606" y="250" width="170" height="70" rx="8" fill="#0f172a"/><text x="620" y="276" fill="#ffffff" font-weight="700">4 · retry</text><text x="620" y="296" fill="#cbd5e1">mesma chave</text>
    <rect x="798" y="250" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/><text x="812" y="276" fill="#0f172a" font-weight="700">5 · ERP reconhece</text><text x="812" y="296" fill="#475569">devolve P-101 de novo,</text><text x="812" y="311" fill="#475569">sem gravar nada</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="200" y1="285" x2="220" y2="285" marker-end="url(#a)"/>
    <line x1="392" y1="285" x2="412" y2="285" marker-end="url(#a)"/>
    <line x1="584" y1="285" x2="604" y2="285" marker-end="url(#a)"/>
    <line x1="776" y1="285" x2="796" y2="285" marker-end="url(#a)"/>
  </g>
  <text x="30" y="365" font-size="12" fill="#475569">Se a chave fosse gerada pelo modelo a cada chamada, o passo 4 levaria uma chave nova e o resultado seria o da primeira linha.</text>
</svg>
