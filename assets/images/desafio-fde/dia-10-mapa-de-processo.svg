<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">O mapa do processo como ele é</text>
<text x="30" y="58" font-size="14" fill="#475569">Cinco etapas, cada uma com volume e tempo. Sem número em cada caixa, o mapa é um desenho bonito.</text>
<text x="30" y="88" font-size="12" fill="#94a3b8">Exemplo ilustrativo: conciliação de 6.000 recebimentos por mês, ≈ 400 h de trabalho manual.</text>

<text x="663" y="140" font-size="12" font-weight="700" fill="#9a3412" text-anchor="middle">a fila dorme aqui</text>
<path d="M 663 148 L 663 164" stroke="#fdba74" stroke-width="2" fill="none"/>
<path d="M 658 157 L 663 169 L 668 157 Z" fill="#fdba74"/>

<rect x="30" y="172" width="168" height="118" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="44" y="198" font-size="12" font-weight="700" fill="#0f172a">1 · Baixar o extrato</text>
<text x="44" y="220" font-size="12" fill="#475569">1× por dia, no banco</text>
<text x="44" y="240" font-size="11" fill="#475569">e colar na planilha</text>
<text x="44" y="272" font-size="12" font-weight="700" fill="#0f172a">≈ 5 h/mês</text>
<path d="M 199 231 L 210 231" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 206 226 L 213 231 L 206 236 Z" fill="#94a3b8"/>

<rect x="213" y="172" width="168" height="118" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="227" y="198" font-size="12" font-weight="700" fill="#0f172a">2 · Achar a cobrança</text>
<text x="227" y="220" font-size="12" fill="#475569">6.000 buscas no ERP</text>
<text x="227" y="240" font-size="11" fill="#475569">por valor, data e nome</text>
<text x="227" y="272" font-size="12" font-weight="700" fill="#0f172a">2 min no caso fácil</text>
<path d="M 382 231 L 393 231" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 389 226 L 396 231 L 389 236 Z" fill="#94a3b8"/>

<rect x="396" y="172" width="168" height="118" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
<text x="410" y="198" font-size="12" font-weight="700" fill="#0f766e">3 · Casar e dar baixa</text>
<text x="410" y="220" font-size="12" fill="#475569">5.100 casos fáceis</text>
<text x="410" y="240" font-size="11" fill="#475569">85% do volume</text>
<text x="410" y="272" font-size="12" font-weight="700" fill="#0f766e">≈ 170 h/mês</text>
<path d="M 565 231 L 576 231" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 572 226 L 579 231 L 572 236 Z" fill="#94a3b8"/>

<rect x="579" y="172" width="168" height="118" rx="8" fill="#0f172a"/>
<text x="593" y="198" font-size="12" font-weight="700" fill="#ffffff">4 · Tratar a exceção</text>
<text x="593" y="220" font-size="12" fill="#cbd5e1">900 casos · 15%</text>
<text x="593" y="240" font-size="11" fill="#cbd5e1">15 min cada, e-mail,</text>
<text x="593" y="258" font-size="11" fill="#cbd5e1">telefone, "deixa pra depois"</text>
<text x="593" y="282" font-size="12" font-weight="700" fill="#fdba74">≈ 225 h/mês</text>
<path d="M 748 231 L 759 231" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 755 226 L 762 231 L 755 236 Z" fill="#94a3b8"/>

<rect x="762" y="172" width="168" height="118" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="776" y="198" font-size="12" font-weight="700" fill="#0f172a">5 · Fechar o mês</text>
<text x="776" y="220" font-size="12" fill="#475569">o número sai em D+9</text>
<text x="776" y="240" font-size="11" fill="#475569">com o que sobrou na fila</text>
<text x="776" y="272" font-size="12" font-weight="700" fill="#9a3412">meta do CFO: D+5</text>

<path d="M 846 291 L 846 322 L 480 322 L 480 293" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<path d="M 475 301 L 480 289 L 485 301 Z" fill="#94a3b8"/>
<text x="663" y="342" font-size="12" fill="#475569" text-anchor="middle">retrabalho: ≈ 2% das baixas voltam no mês seguinte (≈ 120 casos) e entram de novo na etapa 3</text>

<rect x="30" y="362" width="940" height="88" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="48" y="388" font-size="13" font-weight="700" fill="#9a3412">As 900 exceções, nomeadas uma por uma — é isto que a demo não mostra</text>
<text x="48" y="410" font-size="12" fill="#9a3412">· pagador diferente do titular da cobrança (420/mês)  · pagamento parcial, com juros ou desconto (260/mês)</text>
<text x="48" y="432" font-size="12" fill="#9a3412">· um recebimento para várias cobranças, ou o contrário (140/mês)  · duplicidade e devolução (80/mês)</text>

<rect x="30" y="462" width="940" height="82" rx="8" fill="#0f172a"/>
<text x="48" y="490" font-size="13" font-weight="700" fill="#ffffff">15% do volume consome 56% das horas. É ali que o agente se paga — e não no caso fácil, que já é rápido.</text>
<text x="48" y="514" font-size="12" fill="#cbd5e1">E o número que o cliente já persegue existe antes de você chegar: fechar em D+5 em vez de D+9.</text>
<text x="48" y="534" font-size="12" fill="#94a3b8">Esse número não é o seu KPI de projeto. É a régua que já está pendurada na parede dele.</text>
</svg>
