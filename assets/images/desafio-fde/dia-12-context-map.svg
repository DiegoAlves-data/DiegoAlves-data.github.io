<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">Context map da conciliação</text>
<text x="30" y="58" font-size="14" fill="#475569">Quem fala com quem, o que é traduzido em cada fronteira e onde entra uma camada anticorrupção.</text>

<!-- External systems -->
<rect x="30" y="96" width="190" height="110" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
<text x="46" y="120" font-size="10" font-weight="700" fill="#64748b">SISTEMA EXTERNO</text>
<text x="46" y="142" font-size="15" font-weight="700" fill="#0f172a">Banco e adquirente</text>
<text x="46" y="164" font-size="12" fill="#475569">extrato, PIX, boleto,</text>
<text x="46" y="180" font-size="12" fill="#475569">liquidação do cartão</text>

<rect x="30" y="266" width="190" height="110" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
<text x="46" y="290" font-size="10" font-weight="700" fill="#64748b">SISTEMA EXTERNO</text>
<text x="46" y="312" font-size="15" font-weight="700" fill="#0f172a">ERP legado</text>
<text x="46" y="334" font-size="12" fill="#475569">"títulos", CR_SIT = A,</text>
<text x="46" y="350" font-size="12" fill="#475569">campos de nome curto</text>

<!-- ACLs -->
<rect x="250" y="106" width="150" height="90" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="325" y="128" font-size="9" font-weight="700" fill="#9a3412" text-anchor="middle">CAMADA ANTICORRUPÇÃO</text>
<text x="325" y="146" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">servidor MCP do banco</text>
<text x="325" y="166" font-size="11" fill="#0f172a" text-anchor="middle">lançamento bancário</text>
<text x="325" y="182" font-size="11" fill="#0f172a" text-anchor="middle">→ Recebimento</text>

<rect x="250" y="276" width="150" height="90" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="325" y="298" font-size="9" font-weight="700" fill="#9a3412" text-anchor="middle">CAMADA ANTICORRUPÇÃO</text>
<text x="325" y="316" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">servidor MCP do ERP</text>
<text x="325" y="336" font-size="11" fill="#0f172a" text-anchor="middle">título → Cobrança</text>
<text x="325" y="352" font-size="11" fill="#0f172a" text-anchor="middle">"A" → status: aberta</text>

<!-- arrows ext -> ACL -->
<path d="M 220 151 L 244 151" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 240 146 L 248 151 L 240 156 Z" fill="#94a3b8"/>
<path d="M 220 321 L 244 321" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 240 316 L 248 321 L 240 326 Z" fill="#94a3b8"/>

<!-- Core -->
<rect x="430" y="96" width="260" height="280" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<text x="448" y="122" font-size="10" font-weight="700" fill="#0f766e">CORE · ONDE O AGENTE MORA</text>
<text x="448" y="146" font-size="17" font-weight="700" fill="#0f766e">Conciliação</text>
<line x1="448" y1="160" x2="672" y2="160" stroke="#99f6e4"/>
<text x="448" y="184" font-size="11" font-weight="700" fill="#0f766e">MODELO CANÔNICO</text>
<text x="448" y="206" font-size="13" fill="#0f172a">Recebimento</text>
<text x="448" y="226" font-size="13" fill="#0f172a">Cobrança</text>
<text x="448" y="246" font-size="13" fill="#0f172a">Proposta</text>
<text x="448" y="266" font-size="13" fill="#0f172a">Exceção</text>
<text x="448" y="300" font-size="11" fill="#475569">dinheiro sempre em centavos,</text>
<text x="448" y="316" font-size="11" fill="#475569">com a moeda explícita</text>
<text x="448" y="350" font-size="11" fill="#475569">eventos: PagamentoRecebido,</text>
<text x="448" y="366" font-size="11" fill="#475569">ExcecaoAberta, BaixaDesfeita</text>

<!-- arrows ACL -> core -->
<path d="M 400 151 L 424 151" stroke="#0f766e" stroke-width="2" fill="none"/>
<path d="M 420 146 L 428 151 L 420 156 Z" fill="#0f766e"/>
<path d="M 400 321 L 424 321" stroke="#0f766e" stroke-width="2" fill="none"/>
<path d="M 420 316 L 428 321 L 420 326 Z" fill="#0f766e"/>

<!-- Internal contexts right -->
<rect x="770" y="96" width="200" height="110" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="786" y="120" font-size="10" font-weight="700" fill="#64748b">CONTEXTO INTERNO</text>
<text x="786" y="142" font-size="15" font-weight="700" fill="#0f172a">Atendimento</text>
<text x="786" y="164" font-size="12" fill="#475569">e-mails, comprovantes,</text>
<text x="786" y="180" font-size="12" fill="#475569">"já paguei"</text>

<rect x="770" y="266" width="200" height="110" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="786" y="290" font-size="10" font-weight="700" fill="#64748b">CONTEXTO INTERNO</text>
<text x="786" y="312" font-size="15" font-weight="700" fill="#0f172a">Fiscal</text>
<text x="786" y="334" font-size="12" fill="#475569">notas, competência,</text>
<text x="786" y="350" font-size="12" fill="#475569">impostos</text>

<!-- atendimento -> core dashed -->
<path d="M 770 151 L 696 151" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<path d="M 700 146 L 692 151 L 700 156 Z" fill="#ea580c"/>
<text x="731" y="232" font-size="11" font-weight="700" fill="#9a3412" text-anchor="middle">alegação de</text>
<text x="731" y="247" font-size="11" font-weight="700" fill="#9a3412" text-anchor="middle">pagamento,</text>
<text x="731" y="262" font-size="11" font-weight="700" fill="#9a3412" text-anchor="middle">nunca baixa</text>
<line x1="731" y1="158" x2="731" y2="218" stroke="#fed7aa"/>

<!-- core -> fiscal -->
<path d="M 690 341 L 764 341" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 760 336 L 768 341 L 760 346 Z" fill="#94a3b8"/>
<text x="870" y="394" font-size="11" fill="#475569" text-anchor="middle">cliente–fornecedor: recebe o</text>
<text x="870" y="409" font-size="11" fill="#475569" text-anchor="middle">conciliado, com nota</text>

<!-- Faturamento bottom -->
<rect x="430" y="404" width="260" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="446" y="426" font-size="10" font-weight="700" fill="#64748b">CONTEXTO INTERNO</text>
<text x="446" y="446" font-size="14" font-weight="700" fill="#0f172a">Faturamento</text>
<path d="M 560 404 L 560 382" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 555 386 L 560 378 L 565 386 Z" fill="#94a3b8"/>
<text x="706" y="436" font-size="11" fill="#475569">cliente–fornecedor: cobrança emitida,</text>
<text x="706" y="452" font-size="11" fill="#475569">de preferência com txid (Dia 11)</text>

<rect x="30" y="480" width="940" height="60" rx="8" fill="#0f172a"/>
<text x="500" y="507" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">O legado não entra cru no modelo do agente.</text>
<text x="500" y="528" font-size="13" fill="#cbd5e1" text-anchor="middle">Toda fronteira tem um tradutor, e todo tradutor tem um dono.</text>
</svg>
