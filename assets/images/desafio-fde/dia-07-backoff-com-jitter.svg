<text x="565" y="330" font-size="12" fill="#475569">cada worker sorteia quando tentar dentro da janela:</text>
<text x="565" y="346" font-size="12" fill="#475569">a carga se espalha e a API consegue voltar</text>
<text x="30" y="458" font-size="12" fill="#475569">Ilustrativo. Cada barra é o número de chamadas em 250 ms. O padrão vem do estudo de Marc Brooker na AWS (2015).</text>
