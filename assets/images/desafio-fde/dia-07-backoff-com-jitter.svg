<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="470" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">Backoff espera cada vez mais. O jitter espalha quem espera.</text>
<text x="30" y="58" font-size="14" fill="#475569">A API do banco cai e 100 workers falham juntos. Quando ela volta, em que segundo cada um tenta de novo?</text>
<text x="30" y="102" font-size="14" font-weight="700" fill="#0f172a">Sem jitter</text>
<line x1="70" y1="230" x2="950" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
<text x="70" y="246" font-size="11" fill="#475569" text-anchor="middle">0s</text>
<text x="125" y="246" font-size="11" fill="#475569" text-anchor="middle">1s</text>
<text x="180" y="246" font-size="11" fill="#475569" text-anchor="middle">2s</text>
<text x="290" y="246" font-size="11" fill="#475569" text-anchor="middle">4s</text>
<text x="510" y="246" font-size="11" fill="#475569" text-anchor="middle">8s</text>
<text x="950" y="246" font-size="11" fill="#475569" text-anchor="middle">16s</text>
<line x1="70" y1="190" x2="950" y2="190" stroke="#0f172a" stroke-width="1" stroke-dasharray="4 4"/>
<text x="950" y="184" font-size="11" fill="#0f172a" text-anchor="end">o que a API aguenta</text>
<rect x="125" y="130" width="12" height="100" fill="#c2410c"/>
<text x="141" y="140" font-size="11" fill="#c2410c">100</text>
<rect x="180" y="145" width="12" height="85" fill="#c2410c"/>
<text x="196" y="155" font-size="11" fill="#c2410c">85</text>
<rect x="290" y="160" width="12" height="70" fill="#c2410c"/>
<text x="306" y="170" font-size="11" fill="#c2410c">70</text>
<rect x="510" y="175" width="12" height="55" fill="#c2410c"/>
<text x="526" y="185" font-size="11" fill="#c2410c">55</text>
<text x="565" y="150" font-size="12" fill="#9a3412">as tentativas chegam todas no mesmo instante,</text>
<text x="565" y="166" font-size="12" fill="#9a3412">derrubam a API de novo e quase ninguém passa</text>
<text x="30" y="282" font-size="14" font-weight="700" fill="#0f172a">Com jitter</text>
<line x1="70" y1="410" x2="950" y2="410" stroke="#94a3b8" stroke-width="1.5"/>
<text x="70" y="426" font-size="11" fill="#475569" text-anchor="middle">0s</text>
