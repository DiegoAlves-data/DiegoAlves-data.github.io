<text x="180" y="426" font-size="11" fill="#475569" text-anchor="middle">2s</text>
<text x="290" y="426" font-size="11" fill="#475569" text-anchor="middle">4s</text>
<text x="510" y="426" font-size="11" fill="#475569" text-anchor="middle">8s</text>
<text x="950" y="426" font-size="11" fill="#475569" text-anchor="middle">16s</text>
<line x1="70" y1="370" x2="950" y2="370" stroke="#0f172a" stroke-width="1" stroke-dasharray="4 4"/>
<text x="950" y="364" font-size="11" fill="#0f172a" text-anchor="end">o que a API aguenta</text>
