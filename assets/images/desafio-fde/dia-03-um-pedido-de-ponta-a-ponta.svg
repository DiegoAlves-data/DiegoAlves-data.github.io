<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">Um pedido, de ponta a ponta</text>
  <text x="40" y="62" font-size="14" fill="#475569">"Concilie os PIX de outubro" — o que acontece por trás de uma frase</text>

  <rect x="190" y="164" width="760" height="406" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-dasharray="6 5"/>
  <text x="206" y="184" font-size="13" font-weight="700" fill="#c2410c">LOOP DO AGENTE · repete até o modelo parar de pedir</text>

  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="40" y="86" width="140" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="110" y="114" fill="#0f172a">Usuário</text>
    <rect x="290" y="86" width="160" height="44" rx="8" fill="#0f172a"/>
    <text x="370" y="114" fill="#ffffff">Harness</text>
    <rect x="560" y="86" width="140" height="44" rx="8" fill="#c2410c"/>
    <text x="630" y="114" fill="#ffffff">Modelo (LLM)</text>
    <rect x="800" y="86" width="160" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="880" y="114" fill="#0f172a">Sistemas</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 5">
    <line x1="110" y1="130" x2="110" y2="690"/>
    <line x1="370" y1="130" x2="370" y2="690"/>
    <line x1="630" y1="130" x2="630" y2="690"/>
    <line x1="880" y1="130" x2="880" y2="690"/>
  </g>

  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <line x1="110" y1="154" x2="364" y2="154" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="240" y="148">1 · "Concilie os PIX de outubro"</text>

    <line x1="370" y1="222" x2="624" y2="222" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="497" y="214">2 · system prompt + histórico</text>
    <text x="497" y="240" fill="#475569" font-size="12">+ lista de tools disponíveis</text>

    <line x1="630" y1="270" x2="376" y2="270" stroke="#c2410c" stroke-width="2" marker-end="url(#b)"/>
    <text x="500" y="262" fill="#c2410c" font-weight="700">3 · pedido: buscar_pix(mes=10)</text>

    <line x1="370" y1="330" x2="874" y2="330" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="760" y="322">4 · executa a consulta no banco</text>

    <line x1="880" y1="390" x2="376" y2="390" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="760" y="382">5 · devolve os lançamentos</text>

    <line x1="370" y1="450" x2="624" y2="450" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="497" y="442">6 · tudo de novo + resultado</text>

    <line x1="630" y1="510" x2="376" y2="510" stroke="#c2410c" stroke-width="2" marker-end="url(#b)"/>
    <text x="500" y="502" fill="#c2410c" font-weight="700">7 · pedido: buscar_notas(mes=10)</text>
    <text x="500" y="540" fill="#475569" font-size="12">… e o ciclo 4 → 7 se repete</text>

    <line x1="630" y1="600" x2="376" y2="600" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="500" y="592">8 · resposta final, sem pedido</text>

    <line x1="370" y1="660" x2="116" y2="660" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
    <text x="240" y="652">9 · relatório + log</text>
  </g>

  <g font-size="11" font-weight="700" fill="#9a3412">
    <rect x="645" y="210" width="138" height="24" rx="12" fill="#ffedd5"/>
    <text x="714" y="226" text-anchor="middle">$ tokens de entrada</text>
    <rect x="645" y="258" width="138" height="24" rx="12" fill="#ffedd5"/>
    <text x="714" y="274" text-anchor="middle">$$ tokens de saída</text>
    <rect x="645" y="436" width="138" height="24" rx="12" fill="#ffedd5"/>
    <text x="714" y="452" text-anchor="middle">$$ a janela cresce</text>
    <rect x="645" y="586" width="138" height="24" rx="12" fill="#ffedd5"/>
    <text x="714" y="602" text-anchor="middle">$$ saída de novo</text>
  </g>

  <rect x="40" y="704" width="920" height="40" rx="8" fill="#0f172a"/>
  <text x="500" y="730" font-size="15" fill="#ffffff" text-anchor="middle">O modelo nunca toca no banco. Ele só <tspan font-weight="700" fill="#fdba74">pede</tspan>. Quem executa, guarda o histórico e decide parar é o harness.</text>
</svg>
