<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="470" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">Shadow mode: o agente decide no escuro e ninguém sente</text>
<text x="30" y="58" font-size="14" fill="#475569">O processo atual continua no comando. O candidato responde as mesmas perguntas, e a saída dele vai para comparação.</text>
<rect x="30" y="108" width="180" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="48" y="134" font-size="13" font-weight="700" fill="#0f172a">Tráfego real</text>
<text x="48" y="154" font-size="12" fill="#475569">os lançamentos de</text>
<text x="48" y="170" font-size="12" fill="#475569">hoje, como chegam</text>
<path d="M 210 143 L 268 143" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 262 138 L 272 143 L 262 148 Z" fill="#94a3b8"/>
<path d="M 240 143 L 240 300 L 268 300" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 262 295 L 272 300 L 262 305 Z" fill="#94a3b8"/>
<text x="246" y="230" font-size="11" fill="#475569">espelha</text>
<rect x="272" y="108" width="300" height="70" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
<text x="290" y="134" font-size="13" font-weight="700" fill="#0f766e">CAMPEÃO · processo atual</text>
<text x="290" y="154" font-size="12" fill="#475569">a pessoa do financeiro decide,</text>
<text x="290" y="170" font-size="12" fill="#475569">dá baixa e o mês fecha</text>
<rect x="272" y="265" width="300" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="290" y="291" font-size="13" font-weight="700" fill="#9a3412">DESAFIANTE · agente candidato</text>
<text x="290" y="311" font-size="12" fill="#9a3412">roda inteiro, com tools de leitura</text>
<text x="290" y="327" font-size="12" fill="#9a3412">ou simuladas: nada é gravado</text>
<path d="M 572 143 L 630 143" stroke="#5eead4" stroke-width="2" fill="none"/>
<path d="M 624 138 L 634 143 L 624 148 Z" fill="#5eead4"/>
<path d="M 572 300 L 600 300 L 600 200 L 630 200" stroke="#fdba74" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
<path d="M 624 195 L 634 200 L 624 205 Z" fill="#fdba74"/>
<rect x="634" y="108" width="155" height="70" rx="8" fill="#0f172a"/>
<text x="652" y="140" font-size="13" font-weight="700" fill="#ffffff">Operação real</text>
<text x="652" y="160" font-size="12" fill="#cbd5e1">segue intacta</text>
<rect x="634" y="190" width="311" height="145" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="652" y="216" font-size="13" font-weight="700" fill="#0f172a">Comparador</text>
<text x="652" y="240" font-size="12" fill="#475569">• concordou com a pessoa?</text>
<text x="652" y="262" font-size="12" fill="#475569">• quando discordou, quem errou?</text>
<text x="652" y="284" font-size="12" fill="#475569">• travou em caso que ninguém mapeou?</text>
<text x="652" y="306" font-size="12" fill="#475569">• quanto custou e quanto demorou?</text>
<text x="652" y="328" font-size="12" font-weight="700" fill="#0f172a">O humano é o grupo de controle.</text>
<rect x="30" y="368" width="915" height="82" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="48" y="393" font-size="13" font-weight="700" fill="#9a3412">O que só o shadow mostra</text>
<text x="48" y="415" font-size="12" fill="#9a3412">Campo quebrado, anexo faltando, permissão vencida, o cliente que agrupa pagamento de três filiais.</text>
<text x="48" y="435" font-size="12" fill="#9a3412">Nenhuma suíte offline tem isso, porque ninguém sabia que existia para colocar na suíte.</text>
</svg>
