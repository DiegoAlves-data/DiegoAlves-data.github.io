<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="510" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">pass@k e pass^k: a mesma taxa de acerto, duas conclusões opostas</text>
<text x="30" y="58" font-size="14" fill="#475569">Agente que acerta 90% das vezes por tentativa. No eixo horizontal, o número de tentativas (k) da mesma tarefa.</text>
