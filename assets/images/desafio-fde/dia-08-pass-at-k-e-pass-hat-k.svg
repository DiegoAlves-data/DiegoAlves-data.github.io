<text x="105" y="238.0" font-size="11" fill="#475569" text-anchor="end">50%</text>
<line x1="115" y1="167.0" x2="945" y2="167.0" stroke="#e2e8f0"/>
<text x="105" y="171.0" font-size="11" fill="#475569" text-anchor="end">75%</text>
<line x1="115" y1="100.0" x2="945" y2="100.0" stroke="#e2e8f0"/>
<text x="105" y="104.0" font-size="11" fill="#475569" text-anchor="end">100%</text>
