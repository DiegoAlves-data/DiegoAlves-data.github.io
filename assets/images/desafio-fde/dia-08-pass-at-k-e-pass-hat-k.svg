<text x="391.6666666666667" y="390" font-size="11" fill="#475569" text-anchor="middle">k=4</text>
<text x="483.8888888888889" y="390" font-size="11" fill="#475569" text-anchor="middle">k=5</text>
<text x="576.1111111111111" y="390" font-size="11" fill="#475569" text-anchor="middle">k=6</text>
<text x="668.3333333333334" y="390" font-size="11" fill="#475569" text-anchor="middle">k=7</text>
<text x="760.5555555555555" y="390" font-size="11" fill="#475569" text-anchor="middle">k=8</text>
