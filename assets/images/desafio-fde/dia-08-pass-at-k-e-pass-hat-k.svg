<text x="483.8888888888889" y="84.0" font-size="13" font-weight="700" fill="#0f766e">pass@k — basta acertar uma vez</text>
<text x="503.8888888888889" y="271.52" font-size="13" font-weight="700" fill="#c2410c">pass^k — precisa acertar todas</text>
<rect x="30" y="402" width="520" height="78" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="48" y="426" font-size="13" font-weight="700" fill="#0f172a">Quem escolhe a métrica é o modo de uso, não o modelo.</text>
<text x="48" y="448" font-size="12" fill="#475569">Humano escolhendo a melhor saída entre k → pass@k.</text>
<text x="48" y="468" font-size="12" fill="#475569">Agente agindo sozinho, k vezes seguidas → pass^k.</text>
<rect x="570" y="402" width="375" height="78" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="588" y="426" font-size="13" font-weight="700" fill="#9a3412">Em k=8:  pass^8 = 0,9⁸ = 43%</text>
<text x="588" y="448" font-size="12" fill="#9a3412">o agente "de 90%" tropeça em mais</text>
<text x="588" y="468" font-size="12" fill="#9a3412">da metade das séries de 8 tarefas</text>
</svg>
