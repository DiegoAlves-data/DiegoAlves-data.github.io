<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="490" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">As quatro camadas de guardrail</text>
<text x="30" y="58" font-size="14" fill="#475569">Cada camada é código no harness, em um lugar diferente do fluxo. Nenhuma delas é instrução no prompt.</text>

<rect x="30" y="90" width="940" height="330" rx="10" fill="#fffbf5" stroke="#fdba74" stroke-width="2" stroke-dasharray="7 5"/>
<text x="48" y="116" font-size="13" font-weight="700" fill="#9a3412">4 · LIMITE DE CUSTO — envolve tudo</text>
<text x="48" y="136" font-size="12" fill="#9a3412">Qual é o teto? R$ 0,50 por lançamento · R$ 500 por dia · alerta em 80% · teto por cliente</text>

<rect x="55" y="165" width="110" height="130" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="70" y="222" font-size="13" font-weight="700" fill="#0f172a">Entrada</text>
<text x="70" y="242" font-size="11" fill="#475569">extrato, PIX,</text>
<text x="70" y="257" font-size="11" fill="#475569">anexo, cadastro</text>

<path d="M 165 230 L 178 230" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 174 225 L 184 230 L 174 235 Z" fill="#94a3b8"/>

<rect x="185" y="165" width="150" height="130" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
<text x="200" y="192" font-size="12" font-weight="700" fill="#0f766e">1 · DADO SENSÍVEL</text>
<text x="200" y="214" font-size="11" fill="#475569">O que nunca entra</text>
<text x="200" y="229" font-size="11" fill="#475569">no prompt?</text>
<text x="200" y="252" font-size="11" fill="#0f766e">CPF mascarado</text>
<text x="200" y="267" font-size="11" fill="#0f766e">conta truncada</text>
<text x="200" y="282" font-size="11" fill="#0f766e">só o que o passo usa</text>

<path d="M 335 230 L 348 230" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 344 225 L 354 230 L 344 235 Z" fill="#94a3b8"/>

<rect x="355" y="165" width="150" height="130" rx="8" fill="#0f172a"/>
<text x="370" y="192" font-size="13" font-weight="700" fill="#ffffff">MODELO</text>
<text x="370" y="209" font-size="13" font-weight="700" fill="#ffffff">+ HARNESS</text>
<text x="370" y="233" font-size="11" fill="#cbd5e1">decide e pede ação</text>
<text x="370" y="258" font-size="11" fill="#fdba74">aqui ele pode pedir</text>
<text x="370" y="273" font-size="11" fill="#fdba74">qualquer coisa</text>

<path d="M 505 230 L 518 230" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 514 225 L 524 230 L 514 235 Z" fill="#94a3b8"/>

<rect x="525" y="165" width="150" height="130" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
<text x="540" y="192" font-size="12" font-weight="700" fill="#0f766e">2 · LIMITE DE AÇÃO</text>
<text x="540" y="214" font-size="11" fill="#475569">Até onde ele age</text>
<text x="540" y="229" font-size="11" fill="#475569">sozinho?</text>
<text x="540" y="252" font-size="11" fill="#0f766e">até R$ 5 mil, concilia</text>
<text x="540" y="267" font-size="11" fill="#0f766e">acima, só propõe</text>
<text x="540" y="282" font-size="11" fill="#0f766e">nunca estorna</text>

<path d="M 675 230 L 688 230" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 684 225 L 694 230 L 684 235 Z" fill="#94a3b8"/>

<rect x="695" y="165" width="150" height="130" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
<text x="710" y="192" font-size="12" font-weight="700" fill="#0f766e">3 · VALIDAR SAÍDA</text>
<text x="710" y="214" font-size="11" fill="#475569">É válido antes de</text>
<text x="710" y="229" font-size="11" fill="#475569">virar ação?</text>
<text x="710" y="252" font-size="11" fill="#0f766e">schema e faixa de valor</text>
<text x="710" y="267" font-size="11" fill="#0f766e">a soma bate</text>
<text x="710" y="282" font-size="11" fill="#0f766e">a cobrança existe</text>

<path d="M 845 230 L 858 230" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 854 225 L 864 230 L 854 235 Z" fill="#94a3b8"/>

<rect x="865" y="165" width="80" height="130" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="880" y="222" font-size="13" font-weight="700" fill="#0f172a">Ação</text>
<text x="880" y="242" font-size="11" fill="#475569">no banco</text>
<text x="880" y="257" font-size="11" fill="#475569">e no ERP</text>

<text x="55" y="340" font-size="12" fill="#475569">O modelo pede. Quem decide se acontece é código determinístico nas camadas 2 e 3.</text>
<text x="55" y="360" font-size="12" fill="#475569">A camada 1 é desenhada por subtração: o que não entra no contexto não vaza, não é logado e não vira custo de token.</text>
<text x="55" y="380" font-size="12" fill="#475569">A camada 4 é segurança, não orçamento: agente sem teto é alvo (OWASP LLM10, consumo sem limite).</text>

<rect x="30" y="435" width="940" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="48" y="459" font-size="12" font-weight="700" fill="#0f172a">Prompt é onde eu digo como se comportar. Guardrail é onde eu garanto que ele não consegue. Quando os dois discordam, ganha o código.</text>
</svg>
