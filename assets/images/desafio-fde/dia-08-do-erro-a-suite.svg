<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="430" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">A suíte de eval não se projeta: ela se descobre</text>
<text x="30" y="58" font-size="14" fill="#475569">Primeiro você lê o que deu errado. A métrica é a última coisa a nascer, não a primeira.</text>
<rect x="30" y="120" width="168" height="108" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="44" y="148" font-size="12" font-weight="700" fill="#0f172a">1 · Rode em caso real</text>
<text x="44" y="170" font-size="12" fill="#475569">e leia o trace</text>
<text x="44" y="192" font-size="11" fill="#475569">um por um, no começo</text>
<path d="M 199 174 L 210 174" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 206 169 L 213 174 L 206 179 Z" fill="#94a3b8"/>
<rect x="213" y="120" width="168" height="108" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="227" y="148" font-size="12" font-weight="700" fill="#0f172a">2 · Agrupe as falhas</text>
<text x="227" y="170" font-size="12" fill="#475569">em categorias</text>
<text x="227" y="192" font-size="11" fill="#475569">"filial no lugar da matriz"</text>
<path d="M 382 174 L 393 174" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 389 169 L 396 174 L 389 179 Z" fill="#94a3b8"/>
<rect x="396" y="120" width="168" height="108" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="410" y="148" font-size="12" font-weight="700" fill="#9a3412">3 · Vire caso + grader</text>
<text x="410" y="170" font-size="12" fill="#9a3412">um por categoria</text>
<text x="410" y="192" font-size="11" fill="#9a3412">binário: passou ou não</text>
<path d="M 565 174 L 576 174" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 572 169 L 579 174 L 572 179 Z" fill="#94a3b8"/>
<rect x="579" y="120" width="168" height="108" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="593" y="148" font-size="12" font-weight="700" fill="#0f172a">4 · Mude o sistema</text>
<text x="593" y="170" font-size="12" fill="#475569">e rode a suíte</text>
<text x="593" y="192" font-size="11" fill="#475569">a mesma suíte, de novo</text>
<path d="M 748 174 L 759 174" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M 755 169 L 762 174 L 755 179 Z" fill="#94a3b8"/>
<rect x="762" y="120" width="168" height="108" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
<text x="776" y="148" font-size="12" font-weight="700" fill="#0f766e">5 · Compare</text>
<text x="776" y="170" font-size="12" fill="#475569">e volte ao passo 1</text>
<text x="776" y="192" font-size="11" fill="#475569">até parar de aprender</text>
<path d="M 944 282 L 944 310 L 114 310 L 114 232" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<path d="M 109 240 L 114 228 L 119 240 Z" fill="#94a3b8"/>
<text x="500" y="303" font-size="12" fill="#475569" text-anchor="middle">saturação teórica: quando o trace novo não ensina mais nada, pare de ler e comece a medir</text>
<rect x="30" y="336" width="915" height="78" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="48" y="361" font-size="13" font-weight="700" fill="#0f172a">Por que nessa ordem</text>
<text x="48" y="383" font-size="12" fill="#475569">Escrever a régua antes de ver a saída do agente produz critério que muda a cada rodada — o grupo de Berkeley chamou isso de criteria drift.</text>
<text x="48" y="403" font-size="12" fill="#475569">Hamel Husain e Shreya Shankar, que escreveram a referência prática sobre o tema, dizem gastar de 60% a 80% do tempo nesta leitura.</text>
</svg>
