<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">Por que um protocolo padrão muda a conta</text>
  <text x="30" y="58" font-size="14" fill="#475569">Sem padrão, cada par agente–sistema é uma integração própria. Com MCP, cada lado implementa o protocolo uma vez.</text>

  <!-- painel esquerdo -->
  <rect x="20" y="78" width="470" height="340" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="106" font-size="15" font-weight="700" fill="#0f172a">Sem padrão</text>
  <text x="40" y="126" font-size="13" fill="#c2410c" font-weight="700">3 agentes × 4 sistemas = 12 integrações</text>

  <g stroke="#94a3b8" stroke-width="1.4">
    <!-- agentes y centers: 175, 265, 355 ; sistemas y centers: 160, 225, 290, 355 -->
    <line x1="190" y1="175" x2="330" y2="160"/><line x1="190" y1="175" x2="330" y2="225"/><line x1="190" y1="175" x2="330" y2="290"/><line x1="190" y1="175" x2="330" y2="355"/>
    <line x1="190" y1="265" x2="330" y2="160"/><line x1="190" y1="265" x2="330" y2="225"/><line x1="190" y1="265" x2="330" y2="290"/><line x1="190" y1="265" x2="330" y2="355"/>
    <line x1="190" y1="355" x2="330" y2="160"/><line x1="190" y1="355" x2="330" y2="225"/><line x1="190" y1="355" x2="330" y2="290"/><line x1="190" y1="355" x2="330" y2="355"/>
  </g>
  <g font-size="13">
    <rect x="40" y="153" width="150" height="44" rx="8" fill="#0f172a"/><text x="54" y="180" fill="#ffffff">Agente conciliação</text>
    <rect x="40" y="243" width="150" height="44" rx="8" fill="#0f172a"/><text x="54" y="270" fill="#ffffff">Agente cobrança</text>
    <rect x="40" y="333" width="150" height="44" rx="8" fill="#0f172a"/><text x="54" y="360" fill="#ffffff">Assistente do time</text>

    <rect x="330" y="140" width="140" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="346" y="165" fill="#0f172a">Banco</text>
    <rect x="330" y="205" width="140" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="346" y="230" fill="#0f172a">ERP</text>
    <rect x="330" y="270" width="140" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="346" y="295" fill="#0f172a">Planilha de regras</text>
    <rect x="330" y="335" width="140" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="346" y="360" fill="#0f172a">CRM</text>
  </g>

  <!-- painel direito -->
  <rect x="510" y="78" width="470" height="340" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="530" y="106" font-size="15" font-weight="700" fill="#0f172a">Com MCP</text>
  <text x="530" y="126" font-size="13" fill="#c2410c" font-weight="700">3 clients + 4 servers = 7 implementações</text>

  <g stroke="#94a3b8" stroke-width="1.4">
    <line x1="680" y1="175" x2="728" y2="175"/><line x1="680" y1="265" x2="728" y2="265"/><line x1="680" y1="355" x2="728" y2="355"/>
    <line x1="762" y1="160" x2="820" y2="160"/><line x1="762" y1="225" x2="820" y2="225"/><line x1="762" y1="290" x2="820" y2="290"/><line x1="762" y1="355" x2="820" y2="355"/>
  </g>
  <g font-size="13">
    <rect x="530" y="153" width="150" height="44" rx="8" fill="#0f172a"/><text x="544" y="172" fill="#ffffff">Agente conciliação</text><text x="544" y="189" font-size="11" fill="#cbd5e1">client MCP</text>
    <rect x="530" y="243" width="150" height="44" rx="8" fill="#0f172a"/><text x="544" y="262" fill="#ffffff">Agente cobrança</text><text x="544" y="279" font-size="11" fill="#cbd5e1">client MCP</text>
    <rect x="530" y="333" width="150" height="44" rx="8" fill="#0f172a"/><text x="544" y="352" fill="#ffffff">Assistente do time</text><text x="544" y="369" font-size="11" fill="#cbd5e1">client MCP</text>

    <rect x="728" y="140" width="34" height="237" rx="6" fill="#fff7ed" stroke="#fdba74"/>
    <text x="750" y="262" font-size="13" font-weight="700" fill="#c2410c" transform="rotate(-90 750 262)" text-anchor="middle">protocolo MCP</text>

    <rect x="820" y="140" width="140" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="834" y="158" fill="#0f172a">Banco</text><text x="834" y="173" font-size="11" fill="#475569">server MCP</text>
    <rect x="820" y="205" width="140" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="834" y="223" fill="#0f172a">ERP</text><text x="834" y="238" font-size="11" fill="#475569">server MCP</text>
    <rect x="820" y="270" width="140" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="834" y="288" fill="#0f172a">Planilha de regras</text><text x="834" y="303" font-size="11" fill="#475569">server MCP</text>
    <rect x="820" y="335" width="140" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="834" y="353" fill="#0f172a">CRM</text><text x="834" y="368" font-size="11" fill="#475569">server MCP</text>
  </g>
</svg>
