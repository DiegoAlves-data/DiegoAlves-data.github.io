<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">O servidor reiniciou no meio da tarefa. E agora?</text>
  <text x="30" y="58" font-size="14" fill="#475569">Mesmo lançamento, mesma queda no passo 3. A diferença é se alguém guardou o que já tinha sido feito.</text>

  <text x="30" y="98" font-size="14" font-weight="700" fill="#0f172a">Sem durable execution</text>
  <g font-size="12">
    <rect x="30" y="110" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="44" y="136" fill="#0f172a" font-weight="700">1 · buscar extrato</text><text x="44" y="156" fill="#475569">feito</text>
    <rect x="222" y="110" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="236" y="136" fill="#0f172a" font-weight="700">2 · buscar cobrança</text><text x="236" y="156" fill="#475569">feito</text>
    <rect x="414" y="110" width="170" height="70" rx="8" fill="#0f172a"/><text x="428" y="136" fill="#ffffff" font-weight="700">3 · servidor reinicia</text><text x="428" y="156" fill="#cbd5e1">tudo estava na memória</text>
    <rect x="606" y="110" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="620" y="136" fill="#0f172a" font-weight="700">4 · recomeça do 1</text><text x="620" y="156" fill="#475569">tokens e chamadas</text><text x="620" y="171" fill="#475569">pagos de novo</text>
    <rect x="798" y="110" width="170" height="70" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="812" y="136" fill="#c2410c" font-weight="700">5 · a espera se perde</text><text x="812" y="156" fill="#9a3412">quem estava aguardando</text><text x="812" y="171" fill="#9a3412">aprovação some da fila</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="200" y1="145" x2="220" y2="145" marker-end="url(#a)"/>
    <line x1="392" y1="145" x2="412" y2="145" marker-end="url(#a)"/>
    <line x1="584" y1="145" x2="604" y2="145" marker-end="url(#a)"/>
    <line x1="776" y1="145" x2="796" y2="145" marker-end="url(#a)"/>
  </g>

  <text x="30" y="238" font-size="14" font-weight="700" fill="#0f172a">Com durable execution</text><text x="222" y="238" font-size="13" fill="#475569">cada passo concluído é gravado num histórico fora do servidor</text>
  <g font-size="12">
    <rect x="30" y="250" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="44" y="276" fill="#0f172a" font-weight="700">1 · buscar extrato</text><text x="44" y="296" fill="#475569">feito e gravado</text>
    <rect x="222" y="250" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="236" y="276" fill="#0f172a" font-weight="700">2 · buscar cobrança</text><text x="236" y="296" fill="#475569">feito e gravado</text>
    <rect x="414" y="250" width="170" height="70" rx="8" fill="#0f172a"/><text x="428" y="276" fill="#ffffff" font-weight="700">3 · servidor reinicia</text><text x="428" y="296" fill="#cbd5e1">o histórico está salvo</text>
    <rect x="606" y="250" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="620" y="276" fill="#0f172a" font-weight="700">4 · outro worker</text><text x="620" y="296" fill="#475569">lê o histórico, não</text><text x="620" y="311" fill="#475569">repete os passos 1 e 2</text>
    <rect x="798" y="250" width="170" height="70" rx="8" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/><text x="812" y="276" fill="#0f172a" font-weight="700">5 · retoma no passo 3</text><text x="812" y="296" fill="#475569">e a espera de 2 dias</text><text x="812" y="311" fill="#475569">pela aprovação continua</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="200" y1="285" x2="220" y2="285" marker-end="url(#a)"/>
    <line x1="392" y1="285" x2="412" y2="285" marker-end="url(#a)"/>
    <line x1="584" y1="285" x2="604" y2="285" marker-end="url(#a)"/>
    <line x1="776" y1="285" x2="796" y2="285" marker-end="url(#a)"/>
  </g>
  <text x="30" y="365" font-size="12" fill="#475569">O que é gravado é o resultado de cada chamada de LLM e de tool. Por isso a escrita do passo 3 ainda precisa ser idempotente (Dia 6):</text>
  <text x="30" y="383" font-size="12" fill="#475569">se a queda for no meio dela, o passo 3 roda de novo.</text>
</svg>
