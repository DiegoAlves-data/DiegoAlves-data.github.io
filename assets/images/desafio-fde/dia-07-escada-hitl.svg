<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="470" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">Human-in-the-loop é uma escada, não um interruptor</text>
<text x="30" y="58" font-size="14" fill="#475569">O agente sobe um degrau quando prova, com dado, que acertou o suficiente no degrau de baixo.</text>
<rect x="30" y="340" width="280" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="44" y="365" font-size="13" font-weight="700" fill="#0f172a">1 · Shadow</text>
<text x="44" y="384" font-size="12" fill="#475569">o agente roda, o humano decide tudo</text>
<rect x="78" y="268" width="280" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="92" y="293" font-size="13" font-weight="700" fill="#0f172a">2 · Aprovação prévia</text>
<text x="92" y="312" font-size="12" fill="#475569">o humano aprova cada proposta</text>
<rect x="126" y="196" width="280" height="60" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="140" y="221" font-size="13" font-weight="700" fill="#c2410c">3 · Exceção + limite</text>
<text x="140" y="240" font-size="12" fill="#9a3412">só a dúvida e o que passa de R$ 5 mil</text>
<rect x="174" y="124" width="280" height="60" rx="8" fill="#0f172a"/>
<text x="188" y="149" font-size="13" font-weight="700" fill="#ffffff">4 · Amostragem</text>
<text x="188" y="168" font-size="12" fill="#cbd5e1">o humano revisa 5% a 10% depois</text>
<text x="560" y="96" font-size="13" font-weight="700" fill="#0f172a">% dos lançamentos que passam por uma pessoa</text>
<line x1="600" y1="370.0" x2="960" y2="370.0" stroke="#e2e8f0"/>
<text x="592" y="374.0" font-size="11" fill="#475569" text-anchor="end">0%</text>
<line x1="600" y1="305.0" x2="960" y2="305.0" stroke="#e2e8f0"/>
<text x="592" y="309.0" font-size="11" fill="#475569" text-anchor="end">25%</text>
<line x1="600" y1="240.0" x2="960" y2="240.0" stroke="#e2e8f0"/>
<text x="592" y="244.0" font-size="11" fill="#475569" text-anchor="end">50%</text>
<line x1="600" y1="175.0" x2="960" y2="175.0" stroke="#e2e8f0"/>
<text x="592" y="179.0" font-size="11" fill="#475569" text-anchor="end">75%</text>
<line x1="600" y1="110.0" x2="960" y2="110.0" stroke="#e2e8f0"/>
<text x="592" y="114.0" font-size="11" fill="#475569" text-anchor="end">100%</text>
<text x="624.5454545454545" y="404" font-size="11" fill="#475569" text-anchor="middle">degrau 1</text>
<text x="681.8181818181819" y="404" font-size="11" fill="#475569" text-anchor="middle">degrau 2</text>
<line x1="649.0909090909091" y1="110" x2="649.0909090909091" y2="370" stroke="#94a3b8" stroke-dasharray="3 4"/>
<text x="780.0" y="404" font-size="11" fill="#475569" text-anchor="middle">degrau 3</text>
<line x1="714.5454545454545" y1="110" x2="714.5454545454545" y2="370" stroke="#94a3b8" stroke-dasharray="3 4"/>
<text x="902.7272727272727" y="404" font-size="11" fill="#475569" text-anchor="middle">degrau 4</text>
<line x1="845.4545454545454" y1="110" x2="845.4545454545454" y2="370" stroke="#94a3b8" stroke-dasharray="3 4"/>
