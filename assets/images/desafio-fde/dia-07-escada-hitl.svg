<text x="960" y="316.6" font-size="12" fill="#c2410c" text-anchor="end">9% na semana 12</text>
<text x="780.0" y="420" font-size="11" fill="#475569" text-anchor="middle">semanas (ilustrativo)</text>
<text x="30" y="456" font-size="12" fill="#475569">A curva caindo é a prova de que a automação está andando sozinha. Se ela para de cair, o problema está no agente, não nas pessoas.</text>
