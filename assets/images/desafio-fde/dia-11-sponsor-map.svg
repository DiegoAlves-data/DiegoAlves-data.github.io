<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="540" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">Sponsor map: cinco papéis, quatro perguntas</text>
<text x="30" y="58" font-size="14" fill="#475569">O caso da série, a conciliação. Cada papel lido pelo que ganha, pelo que perde, pelo que precisa ver e por quando entra.</text>

<rect x="30" y="80" width="180" height="356" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="44" y="106" font-size="14" font-weight="700" fill="#0f172a">Sponsor</text>
<text x="44" y="124" font-size="11" fill="#475569">CFO, diretor financeiro</text>
<line x1="44" y1="136" x2="196" y2="136" stroke="#cbd5e1"/>
<text x="44" y="158" font-size="10" font-weight="700" fill="#64748b">GANHA</text>
<text x="44" y="175" font-size="11" fill="#0f172a">fechar em D+5,</text>
<text x="44" y="190" font-size="11" fill="#0f172a">caixa previsível</text>
<text x="44" y="228" font-size="10" font-weight="700" fill="#64748b">PERDE</text>
<text x="44" y="245" font-size="11" fill="#0f172a">orçamento e credibilidade</text>
<text x="44" y="260" font-size="11" fill="#0f172a">se a conta não fechar</text>
<text x="44" y="298" font-size="10" font-weight="700" fill="#64748b">PRECISA VER</text>
<text x="44" y="315" font-size="11" fill="#0f172a">a conta da fase 1,</text>
<text x="44" y="330" font-size="11" fill="#0f172a">em faixa, não em número</text>
<text x="44" y="368" font-size="10" font-weight="700" fill="#64748b">QUANDO ENTRA</text>
<text x="44" y="385" font-size="11" fill="#0f172a">semana 0 e em cada</text>
<text x="44" y="400" font-size="11" fill="#0f172a">marco de aceite</text>

<rect x="220" y="80" width="180" height="356" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
<text x="234" y="106" font-size="14" font-weight="700" fill="#0f766e">Champion</text>
<text x="234" y="124" font-size="11" fill="#475569">gerência de recebíveis</text>
<line x1="234" y1="136" x2="386" y2="136" stroke="#99f6e4"/>
<text x="234" y="158" font-size="10" font-weight="700" fill="#0f766e">GANHA</text>
<text x="234" y="175" font-size="11" fill="#0f172a">visibilidade e um projeto</text>
<text x="234" y="190" font-size="11" fill="#0f172a">com o nome dela</text>
<text x="234" y="228" font-size="10" font-weight="700" fill="#0f766e">PERDE</text>
<text x="234" y="245" font-size="11" fill="#0f172a">capital político, se</text>
<text x="234" y="260" font-size="11" fill="#0f172a">der errado em público</text>
<text x="234" y="298" font-size="10" font-weight="700" fill="#0f766e">PRECISA VER</text>
<text x="234" y="315" font-size="11" fill="#0f172a">uma vitória pequena</text>
<text x="234" y="330" font-size="11" fill="#0f172a">já no primeiro mês</text>
<text x="234" y="368" font-size="10" font-weight="700" fill="#0f766e">QUANDO ENTRA</text>
<text x="234" y="385" font-size="11" fill="#0f172a">antes de todo mundo:</text>
<text x="234" y="400" font-size="11" fill="#0f172a">é quem abre as portas</text>

<rect x="410" y="80" width="180" height="356" rx="8" fill="#fff7ed" stroke="#fdba74"/>
<text x="424" y="106" font-size="14" font-weight="700" fill="#9a3412">Usuário impactado</text>
<text x="424" y="124" font-size="11" fill="#9a3412">analistas de conciliação</text>
<line x1="424" y1="136" x2="576" y2="136" stroke="#fed7aa"/>
<text x="424" y="158" font-size="10" font-weight="700" fill="#9a3412">GANHA</text>
<text x="424" y="175" font-size="11" fill="#0f172a">o fim da fila de exceção</text>
<text x="424" y="190" font-size="11" fill="#0f172a">e do retrabalho</text>
<text x="424" y="228" font-size="10" font-weight="700" fill="#9a3412">PERDE (OU TEME)</text>
<text x="424" y="245" font-size="11" fill="#0f172a">o emprego e o saber</text>
<text x="424" y="260" font-size="11" fill="#0f172a">que só ele tem</text>
<text x="424" y="298" font-size="10" font-weight="700" fill="#9a3412">PRECISA VER</text>
<text x="424" y="315" font-size="11" fill="#0f172a">o agente errando, e ele</text>
<text x="424" y="330" font-size="11" fill="#0f172a">sendo quem corrige</text>
<text x="424" y="368" font-size="10" font-weight="700" fill="#9a3412">QUANDO ENTRA</text>
<text x="424" y="385" font-size="11" fill="#0f172a">no discovery, como</text>
<text x="424" y="400" font-size="11" fill="#0f172a">autor dos casos de eval</text>
<text x="424" y="424" font-size="10.5" font-weight="700" fill="#9a3412">risco: sabotagem silenciosa</text>

<rect x="600" y="80" width="180" height="356" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="614" y="106" font-size="14" font-weight="700" fill="#0f172a">Blocker</text>
<text x="614" y="124" font-size="11" fill="#475569">TI, segurança, jurídico</text>
<line x1="614" y1="136" x2="766" y2="136" stroke="#cbd5e1"/>
<text x="614" y="158" font-size="10" font-weight="700" fill="#64748b">GANHA</text>
<text x="614" y="175" font-size="11" fill="#0f172a">nada visível: só o risco</text>
<text x="614" y="190" font-size="11" fill="#0f172a">que não aconteceu</text>
<text x="614" y="228" font-size="10" font-weight="700" fill="#64748b">PERDE</text>
<text x="614" y="245" font-size="11" fill="#0f172a">tudo, se vazar dado ou</text>
<text x="614" y="260" font-size="11" fill="#0f172a">uma baixa sair errada</text>
<text x="614" y="298" font-size="10" font-weight="700" fill="#64748b">PRECISA VER</text>
<text x="614" y="315" font-size="11" fill="#0f172a">identidade própria, menor</text>
<text x="614" y="330" font-size="11" fill="#0f172a">privilégio e trace</text>
<text x="614" y="368" font-size="10" font-weight="700" fill="#64748b">QUANDO ENTRA</text>
<text x="614" y="385" font-size="11" fill="#0f172a">semana 1, nunca na</text>
<text x="614" y="400" font-size="11" fill="#0f172a">véspera do go-live</text>

<rect x="790" y="80" width="180" height="356" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="804" y="106" font-size="14" font-weight="700" fill="#9a3412">Dono do dado</text>
<text x="804" y="124" font-size="11" fill="#9a3412">admin do ERP, tesouraria</text>
<line x1="804" y1="136" x2="956" y2="136" stroke="#fed7aa"/>
<text x="804" y="158" font-size="10" font-weight="700" fill="#9a3412">GANHA</text>
<text x="804" y="175" font-size="11" fill="#0f172a">quase nada, e é por isso</text>
<text x="804" y="190" font-size="11" fill="#0f172a">que ninguém lembra dele</text>
<text x="804" y="228" font-size="10" font-weight="700" fill="#9a3412">PERDE</text>
<text x="804" y="245" font-size="11" fill="#0f172a">a estabilidade do</text>
<text x="804" y="260" font-size="11" fill="#0f172a">sistema que é dele</text>
<text x="804" y="298" font-size="10" font-weight="700" fill="#9a3412">PRECISA VER</text>
<text x="804" y="315" font-size="11" fill="#0f172a">só leitura, limite de</text>
<text x="804" y="330" font-size="11" fill="#0f172a">chamadas, plano de volta</text>
<text x="804" y="368" font-size="10" font-weight="700" fill="#9a3412">QUANDO ENTRA</text>
<text x="804" y="385" font-size="11" fill="#0f172a">semana 1, antes do</text>
<text x="804" y="400" font-size="11" fill="#0f172a">primeiro pedido de acesso</text>
<text x="804" y="424" font-size="11" font-weight="700" fill="#9a3412">o mais esquecido</text>

<rect x="30" y="456" width="940" height="64" rx="8" fill="#0f172a"/>
<text x="48" y="482" font-size="13" font-weight="700" fill="#ffffff">O sponsor assina. O champion empurra. O blocker decide se vai ao ar.</text>
<text x="48" y="504" font-size="12" fill="#cbd5e1">O usuário decide se o agente vai ser usado. E o dono do dado decide se ele vai sequer existir.</text>
</svg>
