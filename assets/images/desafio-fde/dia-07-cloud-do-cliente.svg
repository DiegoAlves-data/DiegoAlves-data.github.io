<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">Onde o agente mora: dentro da conta do cliente</text>
  <text x="30" y="58" font-size="14" fill="#475569">O dado não sai. Quem entra é o agente, com as regras e as credenciais de quem é dono da casa.</text>

  <rect x="30" y="84" width="700" height="350" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="48" y="110" font-size="14" font-weight="700" fill="#0f172a">Conta de nuvem do cliente</text><text x="264" y="110" font-size="13" fill="#475569">AWS, Azure ou GCP · região escolhida por ele</text>

  <rect x="48" y="126" width="440" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="62" y="148" font-size="13" font-weight="700" fill="#0f172a">Rede privada, sem saída aberta para a internet</text>
  <g font-size="12">
    <rect x="62" y="162" width="126" height="56" rx="8" fill="#0f172a"/><text x="74" y="186" fill="#ffffff" font-weight="700">fila</text><text x="74" y="204" fill="#cbd5e1">lançamentos</text>
    <rect x="204" y="162" width="126" height="56" rx="8" fill="#0f172a"/><text x="216" y="186" fill="#ffffff" font-weight="700">worker</text><text x="216" y="204" fill="#cbd5e1">o agente</text>
    <rect x="346" y="162" width="126" height="56" rx="8" fill="#0f172a"/><text x="358" y="186" fill="#ffffff" font-weight="700">validador</text><text x="358" y="204" fill="#cbd5e1">e registro</text>
    <text x="62" y="250" fill="#475569">o worker tem uma identidade própria, que só lê o extrato e só</text>
    <text x="62" y="266" fill="#475569">grava propostas: mínimo privilégio</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="188" y1="190" x2="202" y2="190" marker-end="url(#a)"/>
    <line x1="330" y1="190" x2="344" y2="190" marker-end="url(#a)"/>
  </g>

  <g font-size="12">
    <rect x="508" y="126" width="206" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="520" y="150" fill="#0f172a" font-weight="700">modelo (provedor aprovado)</text><text x="520" y="168" fill="#475569">Bedrock, Azure OpenAI ou</text><text x="520" y="184" fill="#475569">Vertex, por endpoint privado</text>
    <rect x="508" y="206" width="206" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="520" y="230" fill="#0f172a" font-weight="700">ERP e banco do cliente</text><text x="520" y="248" fill="#475569">acessados com as credenciais</text><text x="520" y="264" fill="#475569">e a política dele</text>
    <rect x="48" y="292" width="210" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="60" y="316" fill="#0f172a" font-weight="700">cofre de segredos</text><text x="60" y="334" fill="#475569">nenhuma senha no código</text>
    <rect x="272" y="292" width="216" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="284" y="316" fill="#0f172a" font-weight="700">logs e traces</text><text x="284" y="334" fill="#475569">sem CPF, CNPJ ou nomes</text>
    <rect x="508" y="292" width="206" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="520" y="316" fill="#0f172a" font-weight="700">fila de exceções</text><text x="520" y="334" fill="#475569">o time financeiro dele</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="472" y1="176" x2="506" y2="166" marker-end="url(#a)"/>
    <line x1="472" y1="204" x2="506" y2="236" marker-end="url(#a)"/>
  </g>
  <text x="48" y="384" font-size="12" fill="#0f172a" font-weight="700">O que nunca atravessa a linha tracejada:</text>
  <text x="48" y="402" font-size="12" fill="#475569">extrato, CNPJ, CPF, valores, o texto dos prompts e das respostas.</text>
  <text x="48" y="420" font-size="12" fill="#475569">Cuidado com opções "globais" de processamento: algumas mandam o pedido para outra região.</text>

  <g font-size="12">
    <rect x="770" y="126" width="200" height="96" rx="8" fill="#0f172a"/><text x="782" y="150" fill="#ffffff" font-weight="700">time de deployment</text><text x="782" y="170" fill="#cbd5e1">entra por um papel</text><text x="782" y="186" fill="#cbd5e1">temporário, auditado,</text><text x="782" y="202" fill="#cbd5e1">aprovado pela TI</text>
    <rect x="770" y="262" width="200" height="110" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="782" y="286" fill="#c2410c" font-weight="700">infraestrutura como código</text><text x="782" y="306" fill="#9a3412">o ambiente descrito em</text><text x="782" y="322" fill="#9a3412">arquivos versionados,</text><text x="782" y="338" fill="#9a3412">que recriam tudo igual</text><text x="782" y="354" fill="#9a3412">e ficam com o cliente</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="768" y1="174" x2="732" y2="174" marker-end="url(#a)"/>
    <line x1="768" y1="316" x2="732" y2="316" marker-end="url(#a)"/>
  </g>
  <text x="30" y="474" font-size="13" fill="#475569">Os nomes dos serviços mudam de nuvem para nuvem. As seis caixas, não.</text>
</svg>
